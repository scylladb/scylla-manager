  scylla-manager-db:
    image: scylladb/agent-${SCYLLA_VERSION}
    privileged: true
    ports:
      - "9042:9042"
      - "9142:9142"
      - "10000:10000"
    volumes:
      - type: bind
        source: ./scylla/cassandra-rackdc.dc1r1.properties
        target: /etc/scylla/cassandra-rackdc.properties
      - type: bind
        source: ./scylla/scylla-sm.yaml
        target: /etc/scylla/scylla.yaml
      - type: bind
        source: ./scylla/certs/
        target: /etc/scylla/certs
    networks:
      second:

  minio:
    image: quay.io/minio/minio:${MINIO_VERSION}
    privileged: true
    user: ${CURRENT_UID}:${CURRENT_GID}
    command: server /data --console-address ":9001" --certs-dir=/.minio
    environment:
      MINIO_REGION: ${MINIO_REGION}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: ./minio/data
        target: /data
      - type: bind
        source: ${MINIO_CERT_DIR}
        target: /.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      second:

  fake-gcs-server:
    image: fsouza/fake-gcs-server:${FAKE_GCS_VERSION}
    user: ${CURRENT_UID}:${CURRENT_GID}
    volumes:
      - type: bind
        source: ./fake-gcs/data
        target: /data
    ports:
      - "4443:4443"
    networks:
      second:

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    ports:
      - "9090:9090"
    networks:
      public:

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    # Started only by "make start-dev-env-monitoring": nothing but dashboard
    # development needs it, and the integration tests in CI run on a runner
    # small enough that an idle container is worth not starting.
    profiles: [monitoring]
    ports:
      - "3000:3000"
    environment:
      # Development environment - no login, everyone is an admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      # Mount the individual provisioning directories rather than the whole
      # tree, so that the ones shipped in the image (plugins, alerting) are
      # not shadowed by an empty dir.
      - type: bind
        source: ./grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
        read_only: true
      - type: bind
        source: ./grafana/provisioning/dashboards
        target: /etc/grafana/provisioning/dashboards
        read_only: true
      # The dashboards live outside the test environment, in /monitoring:
      # they are proposed to the ScyllaDB Monitoring stack, and the dev env
      # is where they are developed rather than where they belong.
      - type: bind
        source: ../monitoring
        target: /var/lib/grafana/dashboards
        read_only: true
    networks:
      public:

networks:
  public:
    driver: bridge
    ipam:
      driver: default
  second:
    driver: bridge
    ipam:
      driver: default
