services:
  dc1_node_1:
    image: scylladb/agent-${SCYLLA_VERSION}
    privileged: true
    environment:
      AWS_ACCESS_KEY_ID: miniouser
      AWS_SECRET_ACCESS_KEY: minio1234
    volumes:
      - type: bind
        source: ./scylla/cassandra-rackdc.dc1r1.properties
        target: /etc/scylla/cassandra-rackdc.properties
      - type: bind
        source: ./scylla/scylla.yaml
        target: /etc/scylla/scylla.yaml
      - type: bind
        source: ./scylla/certs/
        target: /etc/scylla/certs
      - type: bind
        source: ./localstorage/data
        target: /var/lib/localstorage
    networks:
      public:
      second:

