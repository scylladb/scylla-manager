services:
  scylla-manager:
    image: scylladb/scylla-manager
    networks:
      public:
    depends_on:
      - scylla-manager-db

  scylla-manager-db:
    image: scylladb/scylla
    volumes:
      - scylla_manager_db_data:/var/lib/scylla
    networks:
      public:
    command: --smp 1 --memory 1G

  scylla:
    build:
      context: .
    image: scylladb/scylla-with-agent
    volumes:
      - scylla_data:/var/lib/scylla
    networks:
      public:
        ipv4_address: 192.168.100.100
    command: --smp 1 --memory 1G

  silo:
    image: docker.io/pgsty/silo
    volumes:
      - silo_data:/data
    networks:
      public:
    ports:
      - "9001:9000"
    environment:
      MINIO_ROOT_USER: silo
      MINIO_ROOT_PASSWORD: silo1234
    command: server /data

volumes:
  silo_data:
  scylla_data:
  scylla_manager_db_data:

networks:
  public:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.100.0/24