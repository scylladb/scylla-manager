# PR suite - executed on every PR and push to master or release branch.
# It consists of the oldest supported release on vnodes,
# the newest release on tablets and nightly on tablets.

- suite: pr
  scylla-version: scylla:2025.1.16
  ip-family: IPV6
  tablets: disabled
  ssl-enabled: false

- suite: pr
  scylla-version: scylla:2026.3.2
  ip-family: IPV4
  tablets: enabled
  ssl-enabled: true
  backup-method: rclone
  restore-method: native

- suite: pr
  scylla-version: scylla-nightly:latest
  ip-family: IPV4
  tablets: enabled
  ssl-enabled: true
  backup-method: native
  restore-method: native
  backup-provider: gcs

# Release suite - executed weekly and manually before the release.
# It consists of all other configs that SM should be tested against.

- suite: release
  scylla-version: scylla:2025.1.16
  ip-family: IPV4
  tablets: disabled
  ssl-enabled: true

- suite: release
  scylla-version: scylla:2025.1.16
  ip-family: IPV6
  tablets: enabled
  ssl-enabled: false

- suite: release
  scylla-version: scylla:2026.1.14
  ip-family: IPV4
  tablets: enabled
  ssl-enabled: true
  backup-method: native
  restore-method: native

- suite: release
  scylla-version: scylla:2026.1.14
  ip-family: IPV6
  tablets: disabled
  ssl-enabled: false
  backup-method: rclone
  restore-method: rclone
  backup-provider: localstorage

- suite: release
  scylla-version: scylla:2026.2.7
  ip-family: IPV4
  tablets: enabled
  ssl-enabled: true
  backup-method: rclone
  restore-method: native

- suite: release
  scylla-version: scylla:2026.2.7
