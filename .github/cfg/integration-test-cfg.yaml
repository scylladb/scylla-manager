- scylla-version: scylla:2026.2.5
  ip-family: IPV4
  tablets: enabled
  ssl-enabled: true
  backup-method: native
  restore-method: native
  backup-provider: gcs

- scylla-version: scylla:2026.2.5
  ip-family: IPV4
  tablets: disabled
  ssl-enabled: false
