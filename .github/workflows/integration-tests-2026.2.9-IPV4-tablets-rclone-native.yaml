concurrency:
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    group: int-integration-tests-2026.2.9-IPV4-tablets-rclone-native-${{ github.ref }}
jobs:
    tests:
        uses: ./.github/workflows/integration-tests.yaml
        with:
            config-name: integration-tests-2026.2.9-IPV4-tablets-rclone-native
            scylla-version: scylla:2026.2.9
            ip-family: IPV4
            tablets: enabled
            ssl-enabled: "true"
            backup-method: rclone
            restore-method: native
name: integration-tests-2026.2.9-IPV4-tablets-rclone-native
"on":
    schedule:
        - cron: 0 22 * * 0
    workflow_call: {}
    workflow_dispatch: {}
permissions:
    contents: read
