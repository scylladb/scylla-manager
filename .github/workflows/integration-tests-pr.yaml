name: integration-tests-pr

# PR suite - executed on every PR and push to master or release branch.
on:
  push:
    branches:
      - master
      - 'branch-**'
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"
      - "LICENSE"
      - ".github/workflows/docs-*"
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"
      - "LICENSE"
      - ".github/workflows/docs-*"

# Cancel superseded runs on pull requests and on pushes to master, but not on
# the 'branch-**' release branches, where a superseded run should still finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 2025.1.16-vnodes
            scylla-version: scylla:2025.1.16
            ip-family: IPV6
            tablets: disabled
            ssl-enabled: "false"
          - name: 2026.3.5-tablets-bmnative-rmnative
            scylla-version: scylla:2026.3.5
            ip-family: IPV4
            tablets: enabled
            ssl-enabled: "true"
            backup-method: native
            restore-method: native
          - name: 2026.4.0-rc2-tablets-bmnative-rmnative
            scylla-version: scylla:2026.4.0-rc2
            ip-family: IPV4
            tablets: enabled
            ssl-enabled: "true"
            backup-method: native
            restore-method: native
          - name: latest-tablets-bmnative-rmnative-gcs
            scylla-version: scylla-nightly:latest
            ip-family: IPV4
            tablets: enabled
            ssl-enabled: "true"
            backup-method: native
            restore-method: native
            backup-provider: gcs
    uses: ./.github/workflows/integration-tests.yaml
    with:
      config-name: ${{ matrix.name }}
      scylla-version: ${{ matrix.scylla-version }}
      ip-family: ${{ matrix.ip-family }}
      tablets: ${{ matrix.tablets }}
      ssl-enabled: ${{ matrix.ssl-enabled }}
      backup-method: ${{ matrix.backup-method || '' }}
      restore-method: ${{ matrix.restore-method || '' }}
      backup-provider: ${{ matrix.backup-provider || '' }}
