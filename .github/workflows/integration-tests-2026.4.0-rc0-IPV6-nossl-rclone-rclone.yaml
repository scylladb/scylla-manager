concurrency:
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    group: int-integration-tests-2026.4.0-rc0-IPV6-nossl-rclone-rclone-${{ github.ref }}
jobs:
    tests:
        uses: ./.github/workflows/integration-tests.yaml
        with:
            config-name: integration-tests-2026.4.0-rc0-IPV6-nossl-rclone-rclone
            scylla-version: scylla:2026.4.0-rc0
            ip-family: IPV6
            tablets: disabled
            ssl-enabled: "false"
            backup-method: rclone
            restore-method: rclone
name: integration-tests-2026.4.0-rc0-IPV6-nossl-rclone-rclone
"on":
    schedule:
        - cron: 0 22 * * 0
    workflow_call: {}
    workflow_dispatch: {}
permissions:
    contents: read
