concurrency:
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    group: int-integration-tests-2026.3.4-IPV4-native-rclone-${{ github.ref }}
jobs:
    tests:
        uses: ./.github/workflows/integration-tests.yaml
        with:
            config-name: integration-tests-2026.3.4-IPV4-native-rclone
            scylla-version: scylla:2026.3.4
            ip-family: IPV4
            tablets: disabled
            ssl-enabled: "true"
            backup-method: native
            restore-method: rclone
name: integration-tests-2026.3.4-IPV4-native-rclone
"on":
    schedule:
        - cron: 0 22 * * 0
    workflow_call: {}
    workflow_dispatch: {}
permissions:
    contents: read
