concurrency:
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    group: int-integration-tests-2025.1.16-IPV6-tablets-nossl-${{ github.ref }}
jobs:
    tests:
        uses: ./.github/workflows/integration-tests.yaml
        with:
            config-name: integration-tests-2025.1.16-IPV6-tablets-nossl
            scylla-version: scylla:2025.1.16
            ip-family: IPV6
            tablets: enabled
            ssl-enabled: "false"
name: integration-tests-2025.1.16-IPV6-tablets-nossl
"on":
    schedule:
        - cron: 0 22 * * 0
    workflow_call: {}
    workflow_dispatch: {}
permissions:
    contents: read
