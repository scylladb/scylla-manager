concurrency:
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    group: int-integration-tests-latest-IPV4-native-native-gcs-${{ github.ref }}
jobs:
    tests:
        uses: ./.github/workflows/integration-tests.yaml
        with:
            config-name: integration-tests-latest-IPV4-native-native-gcs
            scylla-version: scylla-nightly:latest
            ip-family: IPV4
            tablets: disabled
            ssl-enabled: "true"
            backup-method: native
            restore-method: native
            backup-provider: gcs
name: integration-tests-latest-IPV4-native-native-gcs
"on":
    schedule:
        - cron: 0 22 * * 0
    workflow_call: {}
    workflow_dispatch: {}
permissions:
    contents: read
