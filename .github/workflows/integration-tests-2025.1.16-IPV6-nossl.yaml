concurrency:
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    group: int-integration-tests-2025.1.16-IPV6-nossl-${{ github.ref }}
jobs:
    tests:
        uses: ./.github/workflows/integration-tests.yaml
        with:
            config-name: integration-tests-2025.1.16-IPV6-nossl
            scylla-version: scylla:2025.1.16
            ip-family: IPV6
            tablets: disabled
            ssl-enabled: "false"
name: integration-tests-2025.1.16-IPV6-nossl
"on":
    pull_request:
        paths-ignore:
            - docs/**
            - '**/*.md'
            - '**/*.rst'
            - LICENSE
            - .github/workflows/docs-*
        types:
            - opened
            - synchronize
            - reopened
    push:
        branches:
            - master
            - branch-**
        paths-ignore:
            - docs/**
            - '**/*.md'
            - '**/*.rst'
            - LICENSE
            - .github/workflows/docs-*
    workflow_dispatch: {}
permissions:
    contents: read
