concurrency:
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    group: int-integration-tests-2026.1.15-IPV6-nossl-rclone-rclone-localstorage-${{ github.ref }}
jobs:
    tests:
        uses: ./.github/workflows/integration-tests.yaml
        with:
            config-name: integration-tests-2026.1.15-IPV6-nossl-rclone-rclone-localstorage
            scylla-version: scylla:2026.1.15
            ip-family: IPV6
            tablets: disabled
            ssl-enabled: "false"
            backup-method: rclone
            restore-method: rclone
            backup-provider: localstorage
name: integration-tests-2026.1.15-IPV6-nossl-rclone-rclone-localstorage
"on":
    schedule:
        - cron: 0 22 * * 0
    workflow_call: {}
    workflow_dispatch: {}
permissions:
    contents: read
