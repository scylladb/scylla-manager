name: integration-tests-2026.3

# Release suite for Scylla 2026.3 - executed weekly on master and manually
# before the release, on its own or as a part of 'integration-tests-release.yaml'.
on:
  # Weekly run on Sunday night (UTC). GitHub runs it only on the default branch.
  schedule:
    - cron: '0 22 * * 0'
  # Manual run of this version on any branch.
  workflow_dispatch: {}
  # Allows 'integration-tests-release.yaml' to run all versions at once.
  workflow_call: {}

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 2026.3.2-vnodes-bmnative-rmrclone
            scylla-version: scylla:2026.3.2
            ip-family: IPV4
            tablets: disabled
            ssl-enabled: "true"
            backup-method: native
            restore-method: rclone
          - name: 2026.3.2-tablets-bmrclone-rmrclone-gcs
            scylla-version: scylla:2026.3.2
            ip-family: IPV6
            tablets: enabled
            ssl-enabled: "false"
            backup-method: rclone
            restore-method: rclone
            backup-provider: gcs
    uses: ./.github/workflows/integration-tests.yaml
    with:
      config-name: ${{ matrix.name }}
      scylla-version: ${{ matrix.scylla-version }}
      ip-family: ${{ matrix.ip-family }}
      tablets: ${{ matrix.tablets }}
      ssl-enabled: ${{ matrix.ssl-enabled }}
      backup-method: ${{ matrix.backup-method || '' }}
      restore-method: ${{ matrix.restore-method || '' }}
      backup-provider: ${{ matrix.backup-provider || '' }}
